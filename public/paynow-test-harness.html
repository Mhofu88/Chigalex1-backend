<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BizApp ZW — Paynow Test Harness</title>
<style>
body{font-family:Arial,sans-serif;background:#0D0A1A;color:#F0EBF8;padding:16px;max-width:480px;margin:0 auto;}
h1{font-size:1.1rem;color:#F5C518;margin-bottom:4px;}
p.sub{color:#7A6A9A;font-size:.8rem;margin-bottom:16px;}
.card{background:#211A3A;border-radius:14px;padding:16px;margin-bottom:16px;}
.card h2{font-size:.85rem;color:#00D4AA;margin-bottom:10px;}
label{font-size:.75rem;color:#B8A8D8;display:block;margin-bottom:4px;margin-top:8px;}
input,select{width:100%;background:#2A2048;border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:9px 12px;color:#fff;font-size:.85rem;box-sizing:border-box;}
button{width:100%;background:linear-gradient(135deg,#7B2D8B,#9B59B6);color:#fff;border:none;padding:11px;border-radius:100px;font-weight:700;margin-top:12px;font-size:.85rem;}
button.alt{background:linear-gradient(135deg,#00D4AA,#006d56);}
pre{background:#2A2048;border-radius:8px;padding:10px;font-size:.72rem;white-space:pre-wrap;word-break:break-all;margin-top:10px;max-height:260px;overflow:auto;}
.tokbox{font-size:.7rem;color:#00D4AA;word-break:break-all;margin-top:8px;}
</style>
</head>
<body>

<h1>🧪 BizApp ZW — Paynow Test Harness</h1>
<p class="sub">For test-mode Paynow transactions only. No real money moves.</p>

<div class="card">
<h2>0. Backend URL</h2>
<input id="base" value="https://chigalex1-backend.onrender.com"/>
</div>

<div class="card">
<h2>1. Register or Login</h2>
<label>Username</label>
<input id="username" placeholder="testowner1"/>
<label>Phone</label>
<input id="userphone" placeholder="0770000000"/>
<label>Password</label>
<input id="password" type="password" placeholder="testpass123"/>
<button onclick="doRegister()">Register (first time)</button>
<button class="alt" onclick="doLogin()">Login (already registered)</button>
<div class="tokbox" id="tokenBox"></div>
</div>

<div class="card">
<h2>2. Trigger Test Payment</h2>
<label>Listing ID (any test string is fine)</label>
<input id="listingId" value="test_listing_1"/>
<label>Plan</label>
<select id="plan">
  <option value="onetime">onetime</option>
  <option value="monthly">monthly</option>
  <option value="annual">annual</option>
  <option value="free">free</option>
</select>
<label>Method</label>
<select id="method">
  <option value="ecocash">ecocash</option>
  <option value="innbucks">innbucks</option>
</select>
<label>Test phone number</label>
<select id="phone">
  <option value="0771111111">0771111111 — Success (5s)</option>
  <option value="0772222222">0772222222 — Delayed success (30s)</option>
  <option value="0773333333">0773333333 — User cancelled</option>
  <option value="0774444444">0774444444 — Insufficient balance</option>
</select>
<button onclick="doSubscribe()">Subscribe (test)</button>
</div>

<div class="card">
<h2>📋 Result</h2>
<pre id="result">Nothing yet.</pre>
</div>

<script>
let TOKEN = '';

function base(){ return document.getElementById('base').value.replace(/\/$/, ''); }
function show(id, obj){ document.getElementById(id).textContent = typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2); }

async function doRegister(){
  show('result', '⏳ Sending... (first request can take up to 60s if the server was asleep)');
  const body = {
    username: document.getElementById('username').value.trim(),
    phone: document.getElementById('userphone').value.trim(),
    password: document.getElementById('password').value
  };
  try{
    const r = await fetch(base()+'/auth/register', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
    });
    const d = await r.json();
    show('result', d);
    if(d.token){ TOKEN = d.token; document.getElementById('tokenBox').textContent = '✅ Logged in as '+d.user.username; }
  }catch(e){ show('result', 'Error: '+e.message); }
}

async function doLogin(){
  show('result', '⏳ Sending... (first request can take up to 60s if the server was asleep)');
  const body = {
    username: document.getElementById('username').value.trim(),
    password: document.getElementById('password').value
  };
  try{
    const r = await fetch(base()+'/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
    });
    const d = await r.json();
    show('result', d);
    if(d.token){ TOKEN = d.token; document.getElementById('tokenBox').textContent = '✅ Logged in as '+d.user.username; }
  }catch(e){ show('result', 'Error: '+e.message); }
}

async function doSubscribe(){
  if(!TOKEN){ show('result', 'Register or log in first — no token yet.'); return; }
  show('result', '⏳ Sending...');
  const body = {
    listing_id: document.getElementById('listingId').value.trim(),
    plan: document.getElementById('plan').value,
    method: document.getElementById('method').value,
    phone: document.getElementById('phone').value
  };
  try{
    const r = await fetch(base()+'/bizapp/subscribe', {
      method:'POST',
      headers:{'Content-Type':'application/json', 'Authorization':'Bearer '+TOKEN},
      body: JSON.stringify(body)
    });
    const d = await r.json();
    show('result', d);
  }catch(e){ show('result', 'Error: '+e.message); }
}
</script>
</body>
</html>
