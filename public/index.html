  <select id="langFix"></select>

  <div id="root"></div>
  <div id="piAdsBox" style="background:#111;border:1px solid gold;border-radius:12px;padding:12px;margin:10px;text-align:center">
    <div id="pi-ad-container" style="min-height:80px;background:#000;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:8px">
      <span style="color:#666">Pi Ads - Support Africa</span>

    <button id="showAdBtn" style="background:gold;color:black;padding:10px 20px;border-radius:20px;font-weight:bold;border:none;cursor:pointer">▶ Show Pi Ad</button>
  </div>

  <script>
  // FINAL CHIGALEX TRANSLATION SYSTEM - V3
  (function(){
    const BACKEND = "https://chigalex1-backend.onrender.com";
    const langs={
      en:"🇺🇸 EN English", sn:"🇿🇼 SN Shona", nd:"🇿🇼 ND Ndebele",
      zu:"🇿🇦 ZU Zulu", xh:"🇿🇦 XH Xhosa", af:"🇿🇦 AF Afrikaans",
      st:"🇱🇸 ST Sotho", tn:"🇧🇼 TN Tswana", ny:"🇲🇼 NY Chichewa",
      pt:"🇲🇿 PT Portuguese", sw:"🇹🇿 SW Swahili", am:"🇪🇹 AM Amharic",
      rw:"🇷🇼 RW Kinyarwanda", lg:"🇺🇬 LG Luganda", so:"🇸🇴 SO Somali",
      ha:"🇳🇬 HA Hausa", yo:"🇳🇬 YO Yoruba", ig:"🇳🇬 IG Igbo",
      tw:"🇬🇭 TW Twi", wo:"🇸🇳 WO Wolof", fr:"🇫🇷 FR French",
      ar:"🇸🇦 AR Arabic", ber:"ⵜⵎⵣⵖ BER Berber", ln:"🇨🇩 LN Lingala",
      kg:"🇨🇩 KG Kongo"
    };
    const SUPPORTED = Object.keys(langs);

    window.ChigalexTranslations = { supported: SUPPORTED, current: localStorage.getItem('chigalex_lang')||'en', data:{} };

    async function loadLang(lang){
      if(!SUPPORTED.includes(lang)) lang='en';
      try{
        const res = await fetch(`${BACKEND}/api/translations/${lang}`);
        if(!res.ok) throw new Error(res.status);
        const data = await res.json();
        window.ChigalexTranslations.current = lang;
        window.ChigalexTranslations.data = data;
        localStorage.setItem('chigalex_lang', lang);
        localStorage.setItem('selectedLanguage', lang);
        
        // Apply to data-i18n elements
        document.querySelectorAll('[data-i18n]').forEach(el=>{
          const k=el.getAttribute('data-i18n');
          if(data[k]) el.textContent=data[k];
        });
        
        console.log(`✅ Chigalex V3 Loaded: ${lang} - ${Object.keys(data).length} keys`);
        window.dispatchEvent(new CustomEvent('chigalex-lang-loaded', {detail:{lang, data}}));
        window.dispatchEvent(new CustomEvent('chigalex-lang-changed', {detail:{lang, translations:data}}));
        
        const sel=document.getElementById('langFix');
        if(sel) sel.value=lang;
      }catch(e){
        console.warn('Translation load failed for', lang, e);
        if(lang!=='en') loadLang('en');
      }
    }

    function killC(){
      document.querySelectorAll('div').forEach(d=>{
        if(d.innerText && d.innerText.trim()==='C' && d.innerText.length===1 && d.children.length===0){
          d.outerHTML='<img id="africalogo" src="/logo.png?v=9" alt="Africa" style="width:44px;height:44px;border-radius:50%;border:2px solid #f5c518;object-fit:cover;margin-right:8px;">'
        }
      });
      document.querySelectorAll('header img, nav img, img[alt="Chigalex1"]').forEach(img=>{
        if(img && !img.src.includes('logo.png')){
          img.src='/logo.png?v=9'; img.id='africalogo'; img.alt='Africa';
          img.style='width:44px;height:44px;border-radius:50%;border:2px solid #f5c518;object-fit:cover;margin-right:8px;';
          img.onerror=null;
        }
      });
    }
    setTimeout(killC,400);
    setTimeout(killC,1200);
    setInterval(killC,1000);
    new MutationObserver(killC).observe(document.body,{childList:true,subtree:true});

    // Build selector
    const sel=document.getElementById('langFix');
    sel.id='langFix'; sel.innerHTML=''; 
    Object.keys(langs).forEach(k=>{
      const o=document.createElement('option');o.value=k;o.textContent=langs[k];sel.appendChild(o);
    });
    sel.value=localStorage.getItem('chigalex_lang')||'en';
    sel.onchange=e=>loadLang(e.target.value);
    sel.style='position:fixed;top:54px;left:50%;transform:translateX(-50%);width:92%;max-width:360px;background:#0f0f0f;color:gold;border:1px solid gold;padding:10px;border-radius:12px;z-index:9999;font-weight:bold';

    // Auto load
    if(document.readyState==='loading'){
      document.addEventListener('DOMContentLoaded',()=>loadLang(sel.value));
    }else{
      setTimeout(()=>loadLang(sel.value),500);
    }

    window.setChigalexLang = loadLang;
    window.applyLang = loadLang;
  })();
  </script>

  <script>
  async function showPiAd(){
    const b=document.getElementById('showAdBtn'); b.textContent='Loading...';
    try{ await Pi.Ads.showAd("interstitial"); b.textContent='✅ Thanks!'; setTimeout(()=>b.textContent='▶ Show Pi Ad',2000); }
    catch(e){ b.textContent='Try later'; setTimeout(()=>b.textContent='▶ Show Pi Ad',2000); }
  }
  document.getElementById('showAdBtn')?.addEventListener('click',showPiAd);
  </script>
