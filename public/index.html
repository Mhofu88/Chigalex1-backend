<!-- Language Selector will be injected here -->
<script>
(function(){
 const langs={"en":"🇺🇸 EN English","af":"🇿🇦 AF Afrikaans","zu":"🇿🇦 ZU Zulu","xh":"🇿🇦 XH Xhosa","st":"🇱🇸 ST Sotho","fr":"🇫🇷 FR French","sw":"🇹🇿 SW Swahili","pt":"🇲🇿 PT Portuguese","ar":"🇪🇬 AR Arabic","ha":"🇳🇬 HA Hausa","yo":"🇳🇬 YO Yoruba","ig":"🇳🇬 IG Igbo"};
 function applyLang(l){localStorage.setItem('chigalex_lang',l);localStorage.setItem('selectedLanguage',l);location.reload();}
 
 // 1. FORCE REPLACE C LOGO WITH SEA-WATER AFRICA LOGO
 function replaceLogo(){
   const logos = document.querySelectorAll('img[alt="Chigalex1"], header img, nav img, div[style*="background"] img');
   let replaced = false;
   logos.forEach(img=>{
     if(img.src.includes('logo.png')){ 
       img.style.display='block'; 
       replaced=true; 
       return;
     }
     // Replace C or any header logo
     img.src='/logo.png?v=4';
     img.id='africalogo';
     img.alt='Africa';
     img.onerror=null; // NEVER HIDE!
     img.style='width:44px;height:44px;border-radius:50%;border:2px solid #f5c518;object-fit:cover;margin-right:8px;display:block!important;';
     replaced=true;
   });
   // If no img found, inject before title
   if(!replaced){
     const headerTitle = document.querySelector('header div, nav div, h1, [class*="header"]');
     if(headerTitle && !document.getElementById('africalogo')){
       const img=document.createElement('img');
       img.id='africalogo';
       img.src='/logo.png?v=4';
       img.alt='Africa';
       img.style='width:44px;height:44px;border-radius:50%;border:2px solid #f5c518;object-fit:cover;margin-right:8px;';
       headerTitle.prepend(img);
     }
   }
 }
 // Run multiple times to beat React render
 setTimeout(replaceLogo,500);
 setTimeout(replaceLogo,1500);
 setTimeout(replaceLogo,3000);
 setInterval(replaceLogo,5000); // keep checking

 // 2. Language selector INTO header (right side)
 const sel=document.getElementById('langFix')||document.createElement('select');
 sel.id='langFix';
 sel.innerHTML='';
 Object.keys(langs).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=langs[k];sel.appendChild(o);});
 sel.value=localStorage.getItem('chigalex_lang')||'en';
 sel.onchange=e=>applyLang(e.target.value);
 sel.style='position:fixed;top:60px;left:50%;transform:translateX(-50%);width:94%;max-width:340px;background:#1a1a1a;color:white;padding:8px;border-radius:8px;z-index:9999;border:1px solid gold;';
 document.addEventListener('DOMContentLoaded',()=>document.body.appendChild(sel));
 setTimeout(()=>document.body.appendChild(sel),1200);
})();
</script>

<script>
async function showPiAd(){
 const b=document.getElementById('showAdBtn'); b.textContent='Loading...';
 try{ await Pi.Ads.showAd("interstitial"); b.textContent='✅ Thanks!'; setTimeout(()=>b.textContent='⭐ Show Pi Ad',2000); }
 catch(e){ b.textContent='Try later'; setTimeout(()=>b.textContent='⭐ Show Pi Ad',2000); }
}
document.getElementById('showAdBtn')?.addEventListener('click',showPiAd);
