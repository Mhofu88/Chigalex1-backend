    tw:"🇬🇭 TW Twi", wo:"🇸🇳 WO Wolof", fr:"🇫🇷 FR French",
    ar:"🇸🇦 AR Arabic", ber:"ⵜⵎⵣⵖ BER Berber", ln:"🇨🇩 LN Lingala", kg:"🇨🇩 KG Kongo"
  };
  
  async function loadLangV6(lang){
    if(!LANGS[lang]) lang='en';
    console.log('🌍 Loading', lang);
    try{
      const res = await fetch(`${BACKEND}/api/translations/${lang}?_=${Date.now()}`);
      if(!res.ok) throw new Error('HTTP '+res.status);
      const data = await res.json();
      console.log(`✅ ${lang} loaded:`, Object.keys(data).length, 'keys', data['hero-h1']);
      window.ChigalexTranslations = {current:lang, data:data};
      localStorage.setItem('chigalex_lang', lang);
      localStorage.setItem('selectedLanguage', lang);
      
      // Apply now and repeatedly
      const apply = () => {
        let count=0;
        // Find all H1
        document.querySelectorAll('h1').forEach(h1=>{
          if(h1.textContent.includes('Onboarding') && data['hero-h1']){
            console.log('Translating H1:', h1.textContent, '->', data['hero-h1']);
            h1.textContent = data['hero-h1'];
            count++;
          }
        });
        // Find hero P - long paragraph
        document.querySelectorAll('p').forEach(p=>{
          if(p.textContent.includes('Official training hub of Africa Pi') && data['hero-p']){
            console.log('Translating P');
            p.textContent = data['hero-p'];
            count++;
          }
        });
        // Banner
        document.querySelectorAll('div,span').forEach(el=>{
          if(el.childNodes.length!==1 || el.childNodes[0].nodeType!==3) return;
          const t = el.textContent.trim();
          if(t==='SPONSORED • PI POWERED • AFRICA GCV INDUSTRY ALLIANCE' && data['banner-title']){
            el.textContent = data['banner-title']; count++;
          }
          if(t==='AFRICA PI NETWORK EDUCATION HUB' && data['hero-badge']){
            el.textContent = data['hero-badge']; count++;
          }
          if(t==='50M+ Pioneers Worldwide' && data['pi-fact-pioneers']){
            el.textContent = data['pi-fact-pioneers']; count++;
          }
          if(t==='54 African Nations' && data['pi-fact-nations']){
            el.textContent = data['pi-fact-nations']; count++;
          }
        });
        // Generic: if data key is English sentence (future proof)
        document.querySelectorAll('*').forEach(el=>{
          if(el.childNodes.length===1 && el.childNodes[0].nodeType===3){
            const txt = el.textContent.trim();
            if(data[txt]){ el.textContent = data[txt]; count++; }
          }
        });
        console.log(`🔄 Applied ${count} translations for ${lang}`);
        return count;
      };
      
      apply();
      setTimeout(apply, 500);
      setTimeout(apply, 1500);
      setTimeout(apply, 3000);
      setTimeout(apply, 5000);
      
      // Keep watching
      const obs = new MutationObserver(()=>apply());
      obs.observe(document.body, {childList:true, subtree:true, characterData:true});
      setTimeout(()=>obs.disconnect(), 10000);
      
      const sel=document.getElementById('langFix');
      if(sel) sel.value=lang;
      
      // Show success banner
      const banner = document.createElement('div');
      banner.textContent = `✅ ${lang.toUpperCase()} Loaded: ${data['hero-h1']?.substring(0,50) || Object.keys(data).length+' keys'}`;
      banner.style='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:green;color:white;padding:10px 20px;border-radius:20px;z-index:99999;font-weight:bold';
      document.body.appendChild(banner);
      setTimeout(()=>banner.remove(), 4000);
      
    }catch(e){
      console.error('❌ Translation failed', e);
      alert('Translation failed: '+e.message+' - Check backend CORS');
    }
  }

  // Build selector
  function initSel(){
    let sel=document.getElementById('langFix');
    if(!sel){
      sel=document.createElement('select');
      sel.id='langFix';
      document.body.insertBefore(sel, document.body.firstChild);
    }
    sel.innerHTML='';
    Object.keys(LANGS).forEach(k=>{
      const o=document.createElement('option'); o.value=k; o.textContent=LANGS[k]; sel.appendChild(o);
    });
    sel.value=localStorage.getItem('chigalex_lang')||'en';
    sel.style='position:fixed;top:54px;left:50%;transform:translateX(-50%);width:92%;max-width:360px;background:#0f0f0f;color:gold;border:1px solid gold;padding:10px;border-radius:12px;z-index:9999;font-weight:bold';
    sel.onchange=e=>loadLangV6(e.target.value);
    // Load initial
    setTimeout(()=>loadLangV6(sel.value), 1000);
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', initSel);
  }else{
    initSel();
  }

  window.setChigalexLang = loadLangV6;
  window.loadLangV6 = loadLangV6;
})();
</script>

<script>
// V5 FINAL - MAP ENGLISH TO ZULU KEYS
(function(){
  const BACKEND = "https://chigalex1-backend.onrender.com";
  const LANGS = {"en":"🇺🇸 EN English","sn":"🇿🇼 SN Shona","nd":"🇿🇼 ND Ndebele","zu":"🇿🇦 ZU Zulu","xh":"🇿🇦 XH Xhosa","af":"🇿🇦 AF Afrikaans","st":"🇱🇸 ST Sotho","tn":"🇧🇼 TN Tswana","ny":"🇲🇼 NY Chichewa","pt":"🇲🇿 PT Portuguese","sw":"🇹🇿 SW Swahili","am":"🇪🇹 AM Amharic","rw":"🇷🇼 RW Kinyarwanda","lg":"🇺🇬 LG Luganda","so":"🇸🇴 SO Somali","ha":"🇳🇬 HA Hausa","yo":"🇳🇬 YO Yoruba","ig":"🇳🇬 IG Igbo","tw":"🇬🇭 TW Twi","wo":"🇸🇳 WO Wolof","fr":"🇫🇷 FR French","ar":"🇸🇦 AR Arabic","ber":"ⵜⵎⵣⵖ BER Berber","ln":"🇨🇩 LN Lingala","kg":"🇨🇩 KG Kongo"};
  const EN_TO_KEY = {
    "Onboarding": "hero-h1", // partial
    "All of Africa": "hero-h1", // we will replace whole H1
    "Official training hub of Africa Pi GCV Industry Alliance. We educate, verify, and connect 54 nations to build a real enclosed Pi economy at GCV $314,159.": "hero-p",
    "50M+ Pioneers Worldwide": "pi-fact-pioneers",
    "54 African Nations": "pi-fact-nations",
    "SPONSORED • PI POWERED • AFRICA GCV INDUSTRY ALLIANCE": "banner-title",
    "AFRICA PI NETWORK EDUCATION HUB": "hero-badge"
  };

  window.ChigalexTranslations = window.ChigalexTranslations || {supported:Object.keys(LANGS), current: localStorage.getItem('chigalex_lang')||'en', data:{}};

  async function loadLang(lang){
    if(!Object.keys(LANGS).includes(lang)) lang='en';
    try{
      const r = await fetch(`${BACKEND}https://chigalex1-backend.onrender.com/api/translations/${lang}?t=${Date.now()}`);
      const data = await r.json();
      window.ChigalexTranslations.current = lang;
      window.ChigalexTranslations.data = data;
      localStorage.setItem('chigalex_lang', lang);
      console.log(`✅ V5 Loaded ${lang} ${Object.keys(data).length} keys`);

      // Apply
      applyTranslations(data);
      // Re-apply after React renders
      setTimeout(()=>applyTranslations(data), 500);
      setTimeout(()=>applyTranslations(data), 1500);
      setTimeout(()=>applyTranslations(data), 3000);

      const sel=document.getElementById('langFix');
      if(sel) sel.value=lang;
    }catch(e){ console.error(e); }
  }

  function applyTranslations(data){
    // 1. data-i18n
    document.querySelectorAll('[data-i18n]').forEach(el=>{
      const k=el.getAttribute('data-i18n');
      if(data[k]) el.textContent=data[k];
    });

    // 2. Direct text replacement for React (hardcoded English)
    // Hero H1 - special handling because it's split into spans
    const h1Candidates = document.querySelectorAll('h1');
    h1Candidates.forEach(h1=>{
      if(h1.textContent.includes('Onboarding') && data['hero-h1']){
        h1.textContent = data['hero-h1'];
      }
    });

    // Hero P
    document.querySelectorAll('p').forEach(p=>{
      const txt = p.textContent.trim();
      if(txt.startsWith('Official training hub') && data['hero-p']){
        p.textContent = data['hero-p'];
      }
    });

    // Banner
    const banners = document.querySelectorAll('*');
    for(let el of banners){
      if(el.childNodes.length===1 && el.childNodes[0].nodeType===3){
        const txt = el.textContent.trim();
        if(txt==='SPONSORED • PI POWERED • AFRICA GCV INDUSTRY ALLIANCE' && data['banner-title']){
          el.textContent = data['banner-title'];
        }
        if(txt==='50M+ Pioneers Worldwide' && data['pi-fact-pioneers']){
          el.textContent = '✅ ' + data['pi-fact-pioneers'];
        }
        if(txt==='54 African Nations' && data['pi-fact-nations']){
          el.textContent = '✅ ' + data['pi-fact-nations'];
        }
        if(txt==='AFRICA PI NETWORK EDUCATION HUB' && data['hero-badge']){
          el.textContent = data['hero-badge'];
        }
      }
    }

    // More generic: if element's text is exactly a key from en.json, replace
    // We need en.json mapping - for now use the keys we know
    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null);
    let node;
    while(node = walker.nextNode()){
      const parent = node.parentElement;
      if(!parent || ['SCRIPT','STYLE','SELECT','OPTION'].includes(parent.tagName)) continue;
      const orig = node.nodeValue;
      const trimmed = orig.trim();
      if(trimmed.length<3) continue;
      // If data has direct mapping for this English? 
      // For now handle hero-p long text
      if(trimmed.includes('Official training hub of Africa Pi GCV Industry Alliance') && data['hero-p']){
        node.nodeValue = data['hero-p'];
      }
    }
  }

  // Build selector
  let sel = document.getElementById('langFix');
  if(!sel){
    sel = document.createElement('select');
    sel.id='langFix';
    document.body.prepend(sel);
  }
  sel.innerHTML='';
  Object.keys(LANGS).forEach(k=>{
    const o=document.createElement('option');o.value=k;o.textContent=LANGS[k];sel.appendChild(o);
  });
  sel.value=localStorage.getItem('chigalex_lang')||'en';
  sel.style='position:fixed;top:54px;left:50%;transform:translateX(-50%);width:92%;max-width:360px;background:#0f0f0f;color:gold;border:1px solid gold;padding:10px;border-radius:12px;z-index:9999;font-weight:bold';
  sel.onchange=e=>loadLang(e.target.value);

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',()=>loadLang(sel.value));
  }else{
    setTimeout(()=>loadLang(sel.value), 800);
  }

  window.setChigalexLang = loadLang;

  // Watch for React re-renders
  new MutationObserver(()=>{
    if(window.ChigalexTranslations.data && Object.keys(window.ChigalexTranslations.data).length>0){
      applyTranslations(window.ChigalexTranslations.data);
    }
  }).observe(document.body, {childList:true, subtree:true});

})();
</script>
