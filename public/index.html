  <!-- V8 FULL TRANSLATOR - ONLY ONE TRANSLATOR NOW -->
  <script id="V8-FULL-TRANSLATOR">
  console.log('V8 Full Translator - 495 keys');
  (function(){
    const BACKEND="https://chigalex1-backend.onrender.com";
    let enData=null;
    async function loadEn(){
      if(enData) return enData;
      const r=await fetch(BACKEND+"/api/translations/en?_="+Date.now());
      enData=await r.json(); return enData;
    }
    async function loadLang(lang){
      try{
        const en=await loadEn();
        const res=await fetch(BACKEND+"/api/translations/"+lang+"?_="+Date.now());
        if(!res.ok) throw new Error('HTTP '+res.status+' - Your '+lang+'.json broken');
        const data=await res.json();
        const engToTrans={};
        for(let k in data){ if(en[k]) engToTrans[en[k].trim()]=data[k]; }
        const apply=()=>{
          let c=0;
          const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,null);
          let node;
          while(node=walker.nextNode()){
            const p=node.parentElement;
            if(!p||['SCRIPT','STYLE','SELECT','OPTION'].includes(p.tagName)) continue;
            const orig=node.nodeValue.trim();
            if(orig.length<3) continue;
            if(engToTrans[orig]){ node.nodeValue=engToTrans[orig]; c++; }
          }
          return c;
        };
        apply(); setTimeout(apply,600); setTimeout(apply,1800); setTimeout(apply,3500);
        let t; window.addEventListener('scroll',()=>{ clearTimeout(t); t=setTimeout(apply,200); });
        new MutationObserver(apply).observe(document.body,{childList:true,subtree:true});
        localStorage.setItem('chigalex_lang',lang);
        const sel=document.getElementById('langFix'); if(sel) sel.value=lang;
        const banner=document.createElement('div');
        banner.textContent='✅ '+lang.toUpperCase()+': '+Object.keys(data).length+' phrases - Scroll!';
        banner.style='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#00c853;color:white;padding:12px 24px;border-radius:24px;z-index:99999;font-weight:bold';
        document.body.appendChild(banner); setTimeout(()=>banner.remove(),5000);
      }catch(e){ console.error(e); alert('Failed '+lang+': '+e.message); }
    }
    window.setChigalexLang=loadLang;
    setTimeout(()=>{ const s=document.getElementById('langFix'); if(s){ s.onchange=e=>loadLang(e.target.value); const saved=localStorage.getItem('chigalex_lang'); if(saved) loadLang(saved); } },1000);
  })();
  </script>
