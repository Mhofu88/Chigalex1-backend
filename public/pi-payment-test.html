<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chigalex1 - Mainnet Step 10 FIXED</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{font-family:system-ui;background:#0D0A1A;color:#F0EBF8;padding:20px;text-align:center}
.card{max-width:520px;margin:20px auto;background:#211A3A;padding:25px;border-radius:20px;border:1px solid #7B2D8B}
.btn{background:linear-gradient(135deg,#7B2D8B,#F5C518);color:#fff;border:none;padding:14px 24px;border-radius:30px;font-weight:800;font-size:16px;cursor:pointer;width:100%;margin:8px 0}
.btn:disabled{opacity:.5}
.log{background:#0D0A1A;padding:12px;border-radius:10px;text-align:left;font-size:12px;font-family:monospace;max-height:400px;overflow-y:auto;margin-top:15px;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<div class="card">
<h2>🔥 Chigalex1 Mainnet Step 10 - FIXED</h2>
<p style="font-size:13px;color:#B8A8D8">Backend bug fixed! Now uses correct routes</p>
<div id="status-box" style="background:#1a1230;padding:12px;border-radius:8px;font-size:12px;margin:10px 0">Checking backend...</div>
<button class="btn" id="auth-btn" onclick="authPi()">1️⃣ Login with Pi (Mainnet)</button>
<button class="btn" id="pay-btn" onclick="processPayment()" disabled>2️⃣ Pay 0.01π - Complete Step 10</button>
<div class="log" id="log">Loading...
</div>
</div>
<script>
const Pi = window.Pi;
let authResult = null;
function log(m){const el=document.getElementById('log'); el.textContent+=m+"\n"; el.scrollTop=el.scrollHeight; console.log(m);}
async function checkBackend(){
  try{
    const r=await fetch('/pi-payments-status'); const d=await r.json();
    document.getElementById('status-box').innerHTML=`Backend: ✅ Online<br>PI_API_KEY: ${d.pi_api_key_set?'✅ Set ('+d.pi_api_key_prefix+')':'❌ NOT SET! Add in Render!'}<br>APP_WALLET: ${d.app_wallet_seed_set?'✅ Set':'❌ NOT SET'}`;
    log('Backend status: '+JSON.stringify(d));
    if(!d.pi_api_key_set) log('❌ FIX NEEDED: Add PI_API_KEY in Render Dashboard > Environment > Add Variable');
  }catch(e){document.getElementById('status-box').innerHTML='Backend: ❌ Offline - Deploying?'; log('Backend check failed: '+e.message);}
}
async function authPi(){
  try{Pi.init({version:"2.0", sandbox:false}); const res=await Pi.authenticate(['payments','username'], ()=>{}); authResult=res; log('✅ Auth as @'+res.user.username+' UID:'+res.user.uid); document.getElementById('auth-btn').disabled=true; document.getElementById('pay-btn').disabled=false;}catch(e){log('Auth fail: '+e.message+' - Open in Pi Browser!');}
}
async function processPayment(){
  try{
    log('Creating 0.01π payment...'); document.getElementById('pay-btn').disabled=true;
    await Pi.createPayment({amount:0.01, memo:"Chigalex1 Mainnet Step 10", metadata:{type:"setup"}}, {
      onReadyForServerApproval: async function(pid){
        log('✅ ReadyForApproval: '+pid); log('Calling /approve-payment...');
        try{
          const r=await fetch('/approve-payment',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({paymentId:pid})});
          const txt=await r.text(); log('Approve raw response: '+txt.slice(0,500));
          const data=JSON.parse(txt); log('✅ APPROVED: '+JSON.stringify(data).slice(0,300));
        }catch(e){log('❌ Approve error: '+e.message);}
      },
      onReadyForServerCompletion: async function(pid, txid){
        log('✅ ReadyForCompletion txid:'+txid); log('Calling /complete-payment...');
        try{
          const r=await fetch('/complete-payment',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({paymentId:pid, txid:txid, username:authResult?.user?.username||'Chigalex1'})});
          const txt=await r.text(); log('Complete raw: '+txt.slice(0,500)); const data=JSON.parse(txt);
          log('🎉 COMPLETED! '+JSON.stringify(data).slice(0,300)); log('✅ GO TO develop.pi AND REFRESH - SHOULD BE 10/10!');
          document.getElementById('pay-btn').textContent='✅ DONE! Check develop.pi';
        }catch(e){log('❌ Complete error: '+e.message);}
      },
      onCancel: function(pid){log('Cancelled: '+pid); document.getElementById('pay-btn').disabled=false;},
      onError: function(err){log('Pi error: '+err.message); document.getElementById('pay-btn').disabled=false;}
    });
  }catch(e){log('Create failed: '+e.message); document.getElementById('pay-btn').disabled=false;}
}
window.addEventListener('load',()=>{log('Pi SDK '+(window.Pi?'found ✅':'not found ❌ - use Pi Browser')); checkBackend();});
</script>

tps:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
