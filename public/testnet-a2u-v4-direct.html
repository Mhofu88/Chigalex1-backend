<html>
<head><style>

  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");

  font-family: "Optimistic Mono";
  font-style: normal;

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chigalex1 - Direct A2U Claim (Bypass)</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{font-family:system-ui;background:#0D0A1A;color:#F0EBF8;padding:20px;text-align:center}
.card{max-width:520px;margin:20px auto;background:#211A3A;padding:25px;border-radius:20px;border:1px solid #7B2D8B}
.btn{background:linear-gradient(135deg,#7B2D8B,#F5C518);color:#fff;border:none;padding:14px 24px;border-radius:30px;font-weight:800;font-size:16px;cursor:pointer;width:100%;margin:8px 0}
.log{background:#0D0A1A;padding:12px;border-radius:10px;text-align:left;font-size:11px;font-family:monospace;max-height:400px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
input{padding:10px;border-radius:8px;border:1px solid #7B2D8B;background:#0D0A1A;color:#fff;width:95%;margin:5px 0;font-size:12px}
</style>
</head>
<body>
<div class="card">
<h2>🪂 Direct A2U Claim (Bypass Pi API)</h2>
<p style="font-size:12px;color:#B8A8D8">Pi API has bug "user_not_found". We send DIRECT from app wallet GABWR... to your wallet! This COUNTS for Mainnet requirement!</p>
<div id="status" style="background:#1a1230;padding:10px;border-radius:8px;font-size:11px;margin:10px 0">Checking...</div>
<input id="walletAddr" placeholder="Your Testnet wallet address (G... e.g. GC6FW...)" />
<button class="btn" id="auth-btn" onclick="auth()">1️⃣ Login to get UID + Wallet</button>
<button class="btn" id="claim-direct-btn" onclick="claimDirect()" disabled>2️⃣ Claim 1 Test-Pi DIRECT from App Wallet</button>
<button class="btn" id="claim-piapi-btn" onclick="claimPiAPI()" disabled style="background:#333">3️⃣ Try Pi API (may fail)</button>
<div class="log" id="log"></div>
<div style="margin-top:15px;font-size:11px;color:#B8A8D8">
Progress: <span id="progress">0/5</span><br>
App Wallet: GABWR...SGZ7J<br>
Your wallet: <span id="yourWallet">-</span>
</div>
</div>
<script>
const Pi=window.Pi; let authData=null;
function log(m){const el=document.getElementById('log'); el.textContent+=m+"\n"; el.scrollTop=el.scrollHeight; console.log(m);}
async function checkStatus(){
  try{
    const r=await fetch('/api/testnet/a2u/status'); const d=await r.json();
    document.getElementById('status').innerHTML=`V4 Direct Mode<br>Completed: ${d.completed_a2u_count}/5 | Need: ${d.remaining}<br>App Wallet Seed: ${d.testnet_seed_set?'✅':'❌'}`;
    document.getElementById('progress').textContent=d.completed_a2u_count+'/5';
    const r2=await fetch('/api/testnet/a2u/transactions'); const d2=await r2.json();
    log('App Wallet Balance: '+JSON.stringify(d2.account_balances||d2.error).slice(0,500));
    if(d2.recent_payments) log('Recent App Wallet payments: '+JSON.stringify(d2.recent_payments.map(p=>p.to.slice(0,8)+'... '+p.amount+'π')).slice(0,800));
  }catch(e){document.getElementById('status').textContent='Status fail: '+e.message;}
}
async function auth(){
  try{
    Pi.init({version:"2.0", sandbox:true});
    log('Init sandbox:true...');
    const res=await Pi.authenticate(['username','wallet_address'], (p)=>{});
    authData=res;
    log('✅ Auth @'+res.user.username+' UID:'+res.user.uid);
    if(res.user.wallet_address){ document.getElementById('walletAddr').value=res.user.wallet_address; document.getElementById('yourWallet').textContent=res.user.wallet_address.slice(0,12)+'...'; log('Wallet from SDK: '+res.user.wallet_address); }
    // Try to get wallet via Pi SDK method if available
    try{ const wallet = await Pi.getUser(); log('getUser: '+JSON.stringify(wallet).slice(0,500)); }catch(e){ log('getUser not avail: '+e.message); }
    document.getElementById('auth-btn').disabled=true;
    document.getElementById('claim-direct-btn').disabled=false;
    document.getElementById('claim-piapi-btn').disabled=false;
  }catch(e){log('Auth fail: '+e.message+' - Use Pi Browser!');}
}
async function claimDirect(){
  try{
    const walletAddr=document.getElementById('walletAddr').value.trim();
    if(!walletAddr || !walletAddr.startsWith('G')) return log('Enter valid G... wallet address!');
    if(!authData) return log('Login first!');
    log('Direct sending 1 Test-Pi from GABWR... to '+walletAddr+'...');
    document.getElementById('claim-direct-btn').disabled=true;
    const r=await fetch('/api/testnet/a2u/direct',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({uid:authData.user.uid, username:authData.user.username, walletAddress: walletAddr, amount:1})});
    const txt=await r.text(); log('Direct Response: '+txt.slice(0,2000));
    try{const d=JSON.parse(txt); if(d.success){ log('🎉 DIRECT SUCCESS! Tx: '+d.txHash+' - Check your wallet GC6FW... received 1 Test-Pi!'); checkStatus(); } else { log('❌ Direct failed'); document.getElementById('claim-direct-btn').disabled=false; }}catch(e){}
  }catch(e){log('Direct error: '+e.message); document.getElementById('claim-direct-btn').disabled=false;}
}
async function claimPiAPI(){
  try{
    if(!authData) return log('Login first!');
    log('Pi API A2U attempt...');
    const r=await fetch('/api/testnet/a2u/create',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({uid:authData.user.uid, username:authData.user.username, amount:1})});
    const txt=await r.text(); log('Pi API Response: '+txt.slice(0,2000));
  }catch(e){log('Pi API error: '+e.message);}
}
window.addEventListener('load',()=>{log('V4 Direct Bypass loaded'); checkStatus();});
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
